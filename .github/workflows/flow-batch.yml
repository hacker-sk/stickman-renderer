name: Flow Batch Images
on:
  workflow_dispatch:
    inputs:
      prompts_file:
        description: Prompt batch file inside flow-batch (.json array, or .txt with blank-line-separated prompts)
        default: prompts/batch.json
      aspect:
        description: Image shape
        type: choice
        default: portrait
        options:
          - portrait
          - landscape
          - square
          - "3:4"
          - "4:3"
      count:
        description: Images per prompt
        type: choice
        default: "1"
        options:
          - "1"
          - "2"
          - "3"
          - "4"
      model:
        description: Flow image model (name as shown in Flow, partial is fine)
        default: Nano Banana Lite
  push:
    branches: [main]
    paths:
      - "flow-batch/trigger-test.txt"
  schedule:
    - cron: "30 2 * * *"
concurrency:
  group: flow-batch
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check configuration
        env:
          FLOW_COOKIES_B64: ${{ secrets.FLOW_COOKIES_B64 }}
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
          FLOW_URL: ${{ vars.FLOW_PROJECT_URL }}
        run: |
          miss=""
          [ -z "$FLOW_COOKIES_B64" ] && miss="$miss FLOW_COOKIES_B64(secret)"
          [ -z "$FLOW_URL" ] && miss="$miss FLOW_PROJECT_URL(variable)"
          if [ -n "$miss" ]; then echo "::error::Missing repository settings:$miss"; exit 1; fi
          [ -z "$RCLONE_CONF" ] && echo "::warning::RCLONE_CONF not set - images will NOT be uploaded to Google Drive (artifact only)"
          case "$FLOW_URL" in *"/project/"*) ;; *) echo "::warning::FLOW_PROJECT_URL does not look like a Flow project URL (expected .../project/<id>)";; esac
          echo "Configuration present"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Download ZAPI Flow extension (only for the extension runner)
        run: |
          # Which runner: flow-batch/runner.txt (run_flow_direct.js = no extension; run_flow.js or no file = ZAPI extension runner).
          RUNNER=$(cat flow-batch/runner.txt 2>/dev/null || echo run_flow.js)
          if [ "$RUNNER" = "run_flow_direct.js" ]; then echo "Direct runner - the ZAPI extension is not needed, download skipped"; exit 0; fi
          EXT_ID=debadkiomlbdambamdpdlgdkgnedcjil
          DEST=flow-batch/extension/zapi-flow
          if [ ! -f "$DEST/manifest.json" ]; then
            mkdir -p "$DEST"
            curl -fsSL -o /tmp/zapi.crx "https://clients2.google.com/service/update2/crx?response=redirect&prodversion=126.0&acceptformat=crx2,crx3&x=id%3D${EXT_ID}%26uc"
            unzip -o -q /tmp/zapi.crx -d "$DEST" || test -f "$DEST/manifest.json"
          fi
          rm -rf "$DEST/_metadata"
          grep -m1 '"version"' "$DEST/manifest.json"
          ls "$DEST" | head -30
      - name: Install dependencies
        working-directory: flow-batch
        run: |
          npm install
          npx playwright install --with-deps chromium
          sudo apt-get install -y xvfb rclone
      - name: Restore saved Flow session
        uses: actions/cache/restore@v4
        with:
          path: flow-batch/session
          key: flow-session-${{ github.run_id }}
          restore-keys: |
            flow-session-
      - name: Run Flow batch
        working-directory: flow-batch
        env:
          FLOW_COOKIES_B64: ${{ secrets.FLOW_COOKIES_B64 }}
          FLOW_URL: ${{ vars.FLOW_PROJECT_URL }}
          PROMPTS_FILE: ${{ github.event_name == 'push' && 'prompts/doodle5.txt' || inputs.prompts_file }}
          FLOW_ASPECT: ${{ inputs.aspect }}
          FLOW_COUNT: ${{ inputs.count }}
          FLOW_MODEL: ${{ inputs.model }}
        run: |
          RUNNER=$(cat runner.txt 2>/dev/null || echo run_flow.js)
          echo "Flow runner: $RUNNER"
          xvfb-run -a --server-args="-screen 0 1440x900x24" node "$RUNNER"
      - name: Save refreshed Flow session
        if: always() && hashFiles('flow-batch/session/cookies.json') != ''
        uses: actions/cache/save@v4
        with:
          path: flow-batch/session
          key: flow-session-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload valid images to Google Drive
        if: always()
        working-directory: flow-batch
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
          DRIVE_FOLDER: ${{ vars.DRIVE_FOLDER }}
        run: |
          if [ -z "$RCLONE_CONF" ]; then echo "RCLONE_CONF not set - skipping Drive upload"; exit 0; fi
          if [ -z "$(ls -A downloads/final 2>/dev/null)" ]; then echo "No valid images to upload"; exit 0; fi
          mkdir -p ~/.config/rclone
          printf '%s' "$RCLONE_CONF" > ~/.config/rclone/rclone.conf
          DEST="gdrive:${DRIVE_FOLDER:-FlowBatch}/$(date +%F-%H%M)"
          rclone copy downloads/final "$DEST" --verbose
          rclone ls "$DEST" | tee debug/drive-listing.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flow-batch-output
          path: |
            flow-batch/downloads
            flow-batch/debug
