name: Render Hindi video

on:
  workflow_dispatch:
    inputs:
      payload:
        description: "JSON payload sent by n8n"
        required: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ffmpeg
        run: sudo apt-get update -y && sudo apt-get install -y ffmpeg fonts-noto-core libraqm0 libfribidi0

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Render the video
        env:
          PAYLOAD: ${{ inputs.payload }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID_2: ${{ secrets.CF_ACCOUNT_ID_2 }}
          CF_API_TOKEN_2: ${{ secrets.CF_API_TOKEN_2 }}
          CF_ACCOUNT_ID_3: ${{ secrets.CF_ACCOUNT_ID_3 }}
          CF_API_TOKEN_3: ${{ secrets.CF_API_TOKEN_3 }}
          COLAB_URL: ${{ secrets.COLAB_URL }}
          COLAB_URL_SOURCE: ${{ secrets.COLAB_URL_SOURCE }}
          COLAB_TOKEN: ${{ secrets.COLAB_TOKEN }}
          IMAGE_PROVIDER_ORDER: ${{ vars.IMAGE_PROVIDER_ORDER }}
        run: python render_hindi.py

      - name: Keep a copy as a release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "hindi-video-${{ github.run_number }}" output/video.mp4 \
            --title "Hindi video ${{ github.run_number }}" --notes "Rendered by run ${{ github.run_id }}" || true
          # keep only the 20 newest releases
          gh release list --limit 100 --json tagName --jq '.[20:][].tagName' | xargs -r -I{} gh release delete {} --yes --cleanup-tag || true

      - name: Tell n8n the job failed
        if: failure()
        env:
          PAYLOAD: ${{ inputs.payload }}
        run: python render_hindi.py --notify-failure
